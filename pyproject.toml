[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urlpo"
version = "0.1.0"
description = "Extract and download all URLs from HTML/JS/CSS files into UrlPo folder"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{name = "Ibrahim"}]
keywords = ["url", "extractor", "downloader", "html", "css", "js", "termux"]
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
urlpo = "urlpo.cli:main"

[project.urls]
Homepage = "https://github.com/ibrahimkhacef5-del/UrlPo"

[tool.setuptools.packages.find]
where = ["."]
include = ["urlpo*"]
